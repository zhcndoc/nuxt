name: ZBuilder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  cancel-in-progress: true
  group: zbuilder

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: zhcndoc
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./zbuilder
          platforms: ${{ matrix.platform }}
          # Push by digest so neither architecture replaces the shared latest tag.
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: |
            ${{ github.repository }}
            ghcr.io/${{ github.repository }}
          cache-from: type=gha,scope=zbuilder-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=zbuilder-${{ matrix.arch }}
          secrets: |
            NUXT_GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: zbuilder-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-platform images
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: zbuilder-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: zhcndoc
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKERHUB_IMAGE: ${{ github.repository }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            sources=()
            for digest in *; do
              sources+=("$image@sha256:$digest")
            done
            docker buildx imagetools create --tag "$image:latest" "${sources[@]}"
            docker buildx imagetools inspect "$image:latest"
          done
